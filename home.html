<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خمن اللاعب</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body>
  <div class="home-screen">
    <header class="home-header">
      <div class="home-user">
        <span class="home-username" id="username-display">...</span>
        <span class="home-coins" id="coins-display">0</span>
      </div>
      <button type="button" class="logout-btn" id="logout-btn">تسجيل الخروج</button>
    </header>

    <main class="home-content">
      <h1 class="home-logo">خمن <span>اللاعب</span></h1>

      <div class="home-card">
        <h2>لعب مع صديق</h2>
        <button type="button" class="btn-primary" id="create-room-btn">إنشاء غرفة جديدة</button>

        <div class="home-divider">أو</div>

        <form id="join-form" class="join-form">
          <input type="text" name="room_code" placeholder="كود الغرفة" required maxlength="6">
          <button type="submit" class="btn-secondary">انضمام</button>
        </form>
        <p class="auth-error" id="join-error" hidden></p>
      </div>
    </main>
  </div>

  <script type="module" src="src/pages/home.page.js"></script>
</body>
</html>
